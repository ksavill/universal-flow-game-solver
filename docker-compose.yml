services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - CORS_ORIGINS=*
      - RELOAD=${RELOAD:-1}
      # Docker Desktop bind mounts do not reliably forward Linux file events.
      # Poll only the two source directories configured in app.py.
      - WATCHFILES_FORCE_POLLING=${WATCHFILES_FORCE_POLLING:-true}
      - WATCHFILES_POLL_DELAY_MS=${WATCHFILES_POLL_DELAY_MS:-2000}
    command: python app.py

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PORT=8000
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL:-2000}
    command: npm run dev -- --port 5173
    depends_on:
      - api
